version: '3.8'

services:
  db:
    image: postgres:16
    container_name: logtrack_db
    environment:
      POSTGRES_DB: logtrack
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: logtrack_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:?defina DOCKER_DATABASE_URL no .env}
      SECRET_KEY: ${SECRET_KEY:?defina SECRET_KEY no .env}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_HOURS: 8
    depends_on:
      - db

volumes:
  postgres_data: