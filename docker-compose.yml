version: '3.8'

services:
  db:
    image: postgres:16
    container_name: logtrack_db
    environment:
      POSTGRES_DB: logtrack
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: logtrack123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: logtrack_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:logtrack123@db:5432/logtrack
      SECRET_KEY: logtrack_secret_key_2024_muito_segura
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_HOURS: 8
    depends_on:
      - db

volumes:
  postgres_data: