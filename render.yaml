services:
  - type: web
    name: logtrack
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      # Banco no Neon (free, não expira) desde 2026-10 — o valor fica só no
      # painel do Render. O Postgres antigo do Render (logtrack-db) saiu
      # daqui; tirar do Blueprint não apaga o banco, isso é feito no painel.
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_HOURS
        value: "8"
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
