<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LogTrack — Entregas</title>
  <script>
    (function () {
      try {
        var escuro = localStorage.getItem('tema') === 'dark';
        document.documentElement.style.backgroundColor = escuro ? '#111827' : '#F0F4FA';
        document.documentElement.style.colorScheme = escuro ? 'dark' : 'light';
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="dashboard-page">

  <button class="btn-menu-mobile" onclick="toggleMenu()">☰</button>
  <div class="sidebar-overlay" onclick="fecharMenu()"></div>

  <aside class="sidebar">
    <div class="sidebar-logo">
      <span>
      <svg viewBox="0 0 56 66" width="30" height="36" role="img" aria-label="LogTrack">
        <defs>
          <linearGradient id="lt-grad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#2E75B6"/>
            <stop offset="100%" stop-color="#1E4D78"/>
          </linearGradient>
        </defs>
        <path d="M28 2C14.7 2 4 12.5 4 25.5 4 42 28 62 28 62S52 42 52 25.5C52 12.5 41.3 2 28 2Z" fill="url(#lt-grad)"/>
        <g fill="#FFFFFF">
          <rect x="10" y="18" width="6" height="9"/>
          <rect x="17" y="15" width="23" height="12" rx="1"/>
          <circle cx="14" cy="29" r="2.3"/>
          <circle cx="31" cy="29" r="2.3"/>
          <circle cx="38" cy="29" r="2.3"/>
        </g>
        <circle cx="45" cy="9" r="7" fill="#27AE60" opacity="0.25"/>
        <circle cx="45" cy="9" r="4" fill="#27AE60"/>
      </svg>
    </span>
      <h2>LogTrack</h2>
    </div>
    <nav class="sidebar-menu">
      <a class="menu-item" href="dashboard.html"><span class="icon">📊</span> Dashboard</a>
      <a class="menu-item active" href="entregas.html"><span class="icon">📦</span> Entregas</a>
      <a class="menu-item" href="motoristas.html"><span class="icon">👤</span> Motoristas</a>
      <a class="menu-item" href="veiculos.html"><span class="icon">🚛</span> Veículos</a>
      <a class="menu-item" href="ocorrencias.html"><span class="icon">⚠️</span> Ocorrências</a>
      <a class="menu-item" href="relatorios.html"><span class="icon">📈</span> Relatórios</a>
      <a class="menu-item" href="conjuntos.html"><span class="icon">🔗</span> Conjuntos</a>
      <a class="menu-item" href="manutencoes.html"><span class="icon">🔧</span> Manutenções</a>
    </nav>
    <div class="sidebar-user">
      <button class="btn-tema" id="btn-tema" onclick="alternarTema()">🌙 Tema Escuro</button>
      <p>Logado como</p>
      <strong id="usuario-perfil"></strong>
      <button class="btn-logout" onclick="logout()">Sair</button>
    </div>
  </aside>

  <main class="main-content">
    <div class="page-header" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;">
      <div>
        <h1>Entregas</h1>
        <p>Gerencie todas as entregas do sistema</p>
      </div>
      <button class="btn btn-primary" onclick="abrirModal()">+ Nova Entrega</button>
    </div>

    <div class="filtros">
      <select id="filtro-status" onchange="filtrar()">
        <option value="">Todos os status</option>
        <option value="aguardando">Aguardando</option>
        <option value="em_rota">Em Rota</option>
        <option value="entregue">Entregue</option>
        <option value="atrasado">Atrasado</option>
        <option value="ocorrencia">Ocorrência</option>
        <option value="cancelado">Cancelado</option>
      </select>
      <input type="text" id="filtro-cliente" placeholder="Buscar por cliente..." onkeyup="filtrar()" style="min-width:200px;" />
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Cliente</th>
            <th>Origem</th>
            <th>Destino</th>
            <th>Status</th>
            <th>Previsão</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tabela-entregas">
          <tr><td colspan="7" style="text-align:center;color:#888;">Carregando...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <div class="modal-overlay" id="modal">
    <div class="modal">
      <div class="modal-header">
        <h2>Nova Entrega</h2>
        <button class="btn-fechar" onclick="fecharModal()">✕</button>
      </div>
      <div class="form-grid">
        <div class="form-group"><label>Cliente *</label><input type="text" id="cliente" placeholder="Nome do cliente" /></div>
        <div class="form-group"><label>Peso (kg)</label><input type="number" id="peso" placeholder="0.00" step="0.01" /></div>
        <div class="form-group"><label>Origem *</label><input type="text" id="origem" placeholder="Endereço de origem" /></div>
        <div class="form-group"><label>Destino *</label><input type="text" id="destino" placeholder="Endereço de destino" /></div>
        <div class="form-group"><label>Motorista</label><select id="motorista-id"><option value="">Selecionar motorista</option></select></div>
        <div class="form-group"><label>Veículo</label><select id="veiculo-id"><option value="">Selecionar veículo</option></select></div>
        <div class="form-group"><label>Previsão *</label><input type="datetime-local" id="previsao" /></div>
        <div class="form-group"><label>Descrição da carga</label><input type="text" id="descricao" placeholder="Opcional" /></div>
      </div>
      <div style="margin-top:24px;display:flex;gap:12px;justify-content:flex-end;">
        <button class="btn btn-outline" onclick="fecharModal()">Cancelar</button>
        <button class="btn btn-primary" onclick="salvarEntrega()">Salvar</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modal-status">
    <div class="modal" style="max-width:360px;">
      <div class="modal-header">
        <h2>Atualizar Status</h2>
        <button class="btn-fechar" onclick="fecharModalStatus()">✕</button>
      </div>
      <div class="form-group">
        <label>Novo status</label>
        <select id="novo-status">
          <option value="aguardando">Aguardando</option>
          <option value="em_rota">Em Rota</option>
          <option value="entregue">Entregue</option>
          <option value="atrasado">Atrasado</option>
          <option value="ocorrencia">Ocorrência</option>
          <option value="cancelado">Cancelado</option>
        </select>
      </div>
      <div style="margin-top:24px;display:flex;gap:12px;justify-content:flex-end;">
        <button class="btn btn-outline" onclick="fecharModalStatus()">Cancelar</button>
        <button class="btn btn-primary" onclick="confirmarStatus()">Confirmar</button>
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/entregas.js"></script>
</body>
</html>
