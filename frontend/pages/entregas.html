<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LogTrack — Entregas</title>
  <script>
    (function () {
      try {
        var escuro = localStorage.getItem('tema') === 'dark';
        document.documentElement.style.backgroundColor = escuro ? '#111827' : '#F0F4FA';
        document.documentElement.style.colorScheme = escuro ? 'dark' : 'light';
      } catch (e) { }
    })();
  </script>
  <link rel="stylesheet" href="../css/style.css" />
</head>

<body class="dashboard-page">

  <button class="btn-menu-mobile" onclick="toggleMenu()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
  <div class="sidebar-overlay" onclick="fecharMenu()"></div>

  <aside class="sidebar">
    <div class="sidebar-logo">
      <span>
        <svg viewBox="0 0 56 66" width="30" height="36" role="img" aria-label="LogTrack">
          <defs>
            <linearGradient id="lt-grad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#2E75B6" />
              <stop offset="100%" stop-color="#1E4D78" />
            </linearGradient>
          </defs>
          <path d="M28 2C14.7 2 4 12.5 4 25.5 4 42 28 62 28 62S52 42 52 25.5C52 12.5 41.3 2 28 2Z"
            fill="url(#lt-grad)" />
          <g fill="#FFFFFF">
            <rect x="10" y="18" width="6" height="9" />
            <rect x="17" y="15" width="23" height="12" rx="1" />
            <circle cx="14" cy="29" r="2.3" />
            <circle cx="31" cy="29" r="2.3" />
            <circle cx="38" cy="29" r="2.3" />
          </g>
          <circle cx="45" cy="9" r="7" fill="#27AE60" opacity="0.25" />
          <circle cx="45" cy="9" r="4" fill="#27AE60" />
        </svg>
      </span>
      <h2>LogTrack</h2>
    </div>
    <nav class="sidebar-menu">
      <a class="menu-item" href="dashboard.html"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg></span> Dashboard</a>
      <a class="menu-item active" href="entregas.html"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 9.4 7.5 4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg></span> Entregas</a>
      <a class="menu-item" href="motoristas.html"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span> Motoristas</a>
      <a class="menu-item" href="veiculos.html"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13" rx="1"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg></span> Veículos</a>
      <a class="menu-item" href="ocorrencias.html"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></span> Ocorrências</a>
      <a class="menu-item" href="relatorios.html"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="20" x2="6" y2="14"/><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/></svg></span> Relatórios</a>
      <a class="menu-item" href="conjuntos.html"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></span> Conjuntos</a>
      <a class="menu-item" href="manutencoes.html"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></span> Manutenções</a>
    </nav>
    <div class="sidebar-user">
      <button class="btn-tema" id="btn-tema" onclick="alternarTema()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg> <span>Tema Escuro</span></button>
      <p>Logado como</p>
      <strong id="usuario-perfil"></strong>
      <button class="btn-logout" onclick="logout()">Sair</button>
    </div>
  </aside>

  <main class="main-content">
    <div class="page-header"
      style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;">
      <div>
        <h1>Entregas</h1>
        <p>Gerencie todas as entregas do sistema</p>
      </div>
      <button class="btn btn-primary" onclick="abrirModal()">+ Nova Entrega</button>
    </div>

    <div class="filtros">
      <input type="text" id="filtro-cliente" placeholder="Buscar por cliente..." onkeyup="filtrar()"
        style="min-width:200px;" />
      <div class="form-group">
        <label style="font-size:12px;color:var(--text-light);">De</label>
        <input type="date" id="filtro-data-inicio" onchange="filtrar()" />
      </div>
      <div class="form-group">
        <label style="font-size:12px;color:var(--text-light);">Até</label>
        <input type="date" id="filtro-data-fim" onchange="filtrar()" />
      </div>
      <select id="filtro-veiculo" onchange="filtrar()">
        <option value="">Todos os veículos</option>
      </select>
      <select id="filtro-motorista" onchange="filtrar()">
        <option value="">Todos os motoristas</option>
      </select>
      <button class="btn btn-outline" onclick="limparFiltros()" style="font-size:12px;">Limpar filtros</button>
    </div>

    <div class="kanban-board" id="kanban-board">
      <div style="color:#888;padding:20px;">Carregando...</div>
    </div>
  </main>

  <div class="modal-overlay" id="modal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-titulo">Nova Entrega</h2>
        <button class="btn-fechar" onclick="fecharModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div class="form-grid">
        <div class="form-group"><label>Cliente *</label><input type="text" id="cliente" placeholder="Nome do cliente" />
        </div>
        <div class="form-group"><label>Peso (kg)</label><input type="number" id="peso" placeholder="0.00" step="0.01" />
        </div>
        <div class="form-group"><label>Valor do frete (R$)</label><input type="text" inputmode="decimal"
            id="valor-frete" placeholder="0,00" /></div>
        <div class="form-group"><label>Origem *</label><input type="text" id="origem"
            placeholder="Endereço de origem" /></div>
        <div class="form-group"><label>Destino *</label><input type="text" id="destino"
            placeholder="Endereço de destino" /></div>
        <div class="form-group"><label>Motorista</label><select id="motorista-id"
            onchange="atualizarVeiculoPorMotorista()">
            <option value="">Selecionar motorista</option>
          </select></div>
        <div class="form-group">
          <label>Veículo</label>
          <select id="veiculo-id">
            <option value="">Selecionar veículo</option>
          </select>
          <small id="conjunto-info" style="color:var(--text-light);font-size:11px;"></small>
        </div>
        <div class="form-group"><label>Previsão *</label><input type="datetime-local" id="previsao" /></div>
        <div class="form-group"><label>Descrição da carga</label><input type="text" id="descricao"
            placeholder="Opcional" /></div>
      </div>
      <div style="margin-top:24px;display:flex;gap:12px;justify-content:flex-end;">
        <button class="btn btn-outline" onclick="fecharModal()">Cancelar</button>
        <button class="btn btn-primary" onclick="salvarEntrega()">Salvar</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modal-status">
    <div class="modal" style="max-width:360px;">
      <div class="modal-header">
        <h2>Atualizar Status</h2>
        <button class="btn-fechar" onclick="fecharModalStatus()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div class="form-group">
        <label>Novo status</label>
        <select id="novo-status">
          <option value="aguardando">Aguardando</option>
          <option value="em_rota">Em Rota</option>
          <option value="entregue">Entregue</option>
          <option value="atrasado">Atrasado</option>
          <option value="ocorrencia">Ocorrência</option>
          <option value="cancelado">Cancelado</option>
        </select>
      </div>
      <div style="margin-top:24px;display:flex;gap:12px;justify-content:flex-end;">
        <button class="btn btn-outline" onclick="fecharModalStatus()">Cancelar</button>
        <button class="btn btn-primary" onclick="confirmarStatus()">Confirmar</button>
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/toasts.js"></script>
  <script src="../js/icons.js"></script>
  <script src="../js/entregas.js"></script>
</body>

</html>
