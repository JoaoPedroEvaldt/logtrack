<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LogTrack — Motoristas</title>
  <script>
    (function () {
      try {
        var escuro = localStorage.getItem('tema') === 'dark';
        document.documentElement.style.backgroundColor = escuro ? '#111827' : '#F0F4FA';
        document.documentElement.style.colorScheme = escuro ? 'dark' : 'light';
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="dashboard-page">

  <button class="btn-menu-mobile" onclick="toggleMenu()">☰</button>
  <div class="sidebar-overlay" onclick="fecharMenu()"></div>

  <aside class="sidebar">
    <div class="sidebar-logo">
      <span>
      <svg viewBox="0 0 56 66" width="30" height="36" role="img" aria-label="LogTrack">
        <defs>
          <linearGradient id="lt-grad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#2E75B6"/>
            <stop offset="100%" stop-color="#1E4D78"/>
          </linearGradient>
        </defs>
        <path d="M28 2C14.7 2 4 12.5 4 25.5 4 42 28 62 28 62S52 42 52 25.5C52 12.5 41.3 2 28 2Z" fill="url(#lt-grad)"/>
        <g fill="#FFFFFF">
          <rect x="10" y="18" width="6" height="9"/>
          <rect x="17" y="15" width="23" height="12" rx="1"/>
          <circle cx="14" cy="29" r="2.3"/>
          <circle cx="31" cy="29" r="2.3"/>
          <circle cx="38" cy="29" r="2.3"/>
        </g>
        <circle cx="45" cy="9" r="7" fill="#27AE60" opacity="0.25"/>
        <circle cx="45" cy="9" r="4" fill="#27AE60"/>
      </svg>
    </span>
      <h2>LogTrack</h2>
    </div>
    <nav class="sidebar-menu">
      <a class="menu-item" href="dashboard.html"><span class="icon">📊</span> Dashboard</a>
      <a class="menu-item" href="entregas.html"><span class="icon">📦</span> Entregas</a>
      <a class="menu-item active" href="motoristas.html"><span class="icon">👤</span> Motoristas</a>
      <a class="menu-item" href="veiculos.html"><span class="icon">🚛</span> Veículos</a>
      <a class="menu-item" href="ocorrencias.html"><span class="icon">⚠️</span> Ocorrências</a>
      <a class="menu-item" href="relatorios.html"><span class="icon">📈</span> Relatórios</a>
      <a class="menu-item" href="conjuntos.html"><span class="icon">🔗</span> Conjuntos</a>
      <a class="menu-item" href="manutencoes.html"><span class="icon">🔧</span> Manutenções</a>
    </nav>
    <div class="sidebar-user">
      <button class="btn-tema" id="btn-tema" onclick="alternarTema()">🌙 Tema Escuro</button>
      <p>Logado como</p>
      <strong id="usuario-perfil"></strong>
      <button class="btn-logout" onclick="logout()">Sair</button>
    </div>
  </aside>

  <main class="main-content">
    <div class="page-header" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;">
      <div>
        <h1>Motoristas</h1>
        <p>Gerencie os motoristas cadastrados</p>
      </div>
      <button class="btn btn-primary" onclick="abrirModal()">+ Novo Motorista</button>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Nome</th>
            <th>CPF</th>
            <th>CNH</th>
            <th>Categoria</th>
            <th>Validade CNH</th>
            <th>Telefone</th>
            <th>Status</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tabela-motoristas">
          <tr><td colspan="9" style="text-align:center;color:#888;">Carregando...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <div class="modal-overlay" id="modal">
    <div class="modal">
      <div class="modal-header">
        <h2>Novo Motorista</h2>
        <button class="btn-fechar" onclick="fecharModal()">✕</button>
      </div>

      <!-- Nome sempre visível -->
      <div class="form-grid" style="margin-bottom:12px;">
        <div class="form-group" style="grid-column:span 2;">
          <label>Nome *</label>
          <input type="text" id="nome" placeholder="Nome completo" />
        </div>
      </div>

      <!-- Campos apenas para novo cadastro -->
      <div id="campos-novo">
        <div class="form-grid">
          <div class="form-group"><label>E-mail *</label><input type="email" id="email" placeholder="email@exemplo.com" /></div>
          <div class="form-group"><label>Senha *</label><input type="password" id="senha" placeholder="Senha de acesso" /></div>
          <div class="form-group"><label>CPF *</label><input type="text" id="cpf" placeholder="000.000.000-00" /></div>
          <div class="form-group"><label>Número CNH *</label><input type="text" id="cnh-numero" placeholder="Número da CNH" /></div>
        </div>
      </div>

      <!-- Campos editáveis sempre visíveis -->
      <div class="form-grid" style="margin-top:12px;">
        <div class="form-group">
          <label>Categoria CNH *</label>
          <select id="cnh-categoria">
            <option value="">Selecionar</option>
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
            <option value="D">D</option>
            <option value="E">E</option>
            <option value="AB">AB</option>
          </select>
        </div>
        <div class="form-group"><label>Validade CNH *</label><input type="date" id="cnh-validade" /></div>
        <div class="form-group"><label>Telefone</label><input type="text" id="telefone" placeholder="(00) 00000-0000" /></div>
      </div>

      <div style="margin-top:24px;display:flex;gap:12px;justify-content:flex-end;">
        <button class="btn btn-outline" onclick="fecharModal()">Cancelar</button>
        <button class="btn btn-primary" onclick="salvarMotorista()">Salvar</button>
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/motoristas.js"></script>
</body>
</html>
