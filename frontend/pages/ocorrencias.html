    <div class="sidebar-user">
      <button class="btn-tema" id="btn-tema" onclick="alternarTema()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg> <span>Tema Escuro</span></button>
      <p>Logado como</p>
      <strong id="usuario-perfil"></strong>
      <button class="btn-logout" onclick="logout()">Sair</button>

  <main class="main-content">
    <div class="page-header" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;">
      <div>
        <h1>Ocorrências</h1>
        <p>Acompanhe todas as ocorrências registradas</p>
      </div>
      <button class="btn btn-primary" onclick="abrirModal()">+ Nova Ocorrência</button>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Veículo</th>
            <th>Entrega</th>
            <th>Tipo</th>
            <th>Descrição</th>
            <th>Data</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tabela-ocorrencias">
          <tr><td colspan="7" style="padding:0;"><div class="loading-state"><span class="spinner"></span> Carregando...</div></td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <div class="modal-overlay" id="modal">
    <div class="modal" style="max-width:480px;">
      <div class="modal-header">
        <h2 id="modal-titulo">Nova Ocorrência</h2>
        <button class="btn-fechar" onclick="fecharModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div class="form-grid">
        <div class="form-group">
          <label>Veículo *</label>
          <select id="veiculo-filtro" onchange="atualizarEntregasDoVeiculo()">
            <option value="">Selecionar veículo</option>
          </select>
        </div>
        <div class="form-group">
          <label>Entrega *</label>
          <select id="entrega-id" disabled>
            <option value="">Selecione um veículo primeiro</option>
          </select>
        </div>
        <div class="form-group">
          <label>Tipo *</label>
          <select id="tipo">
            <option value="">Selecionar</option>
            <option value="atraso">Atraso</option>
            <option value="acidente">Acidente</option>
            <option value="cliente_ausente">Cliente Ausente</option>
            <option value="problema_mecanico">Problema Mecânico</option>
            <option value="extravio">Extravio</option>
            <option value="outro">Outro</option>
          </select>
        </div>
        <div class="form-group" style="grid-column:span 2;">
          <label>Descrição *</label>
          <textarea id="descricao" rows="4" placeholder="Descreva a ocorrência..." style="resize:vertical;"></textarea>
        </div>
      </div>
      <div style="margin-top:24px;display:flex;gap:12px;justify-content:flex-end;">
        <button class="btn btn-outline" onclick="fecharModal()">Cancelar</button>
        <button class="btn btn-primary" onclick="salvarOcorrencia()">Salvar</button>
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/toasts.js"></script>
  <script src="../js/icons.js"></script>
  <script src="../js/ocorrencias.js"></script>
</body>
</html>
