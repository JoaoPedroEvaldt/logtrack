<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LogTrack — Conjuntos</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="dashboard-page">

  <button class="btn-menu-mobile" onclick="toggleMenu()">☰</button>
  <div class="sidebar-overlay" onclick="fecharMenu()"></div>

  <aside class="sidebar">
    <div class="sidebar-logo">
      <span>🚛</span>
      <h2>LogTrack</h2>
      <p>Gestão Operacional</p>
    </div>
    <nav class="sidebar-menu">
      <a class="menu-item" href="dashboard.html"><span class="icon">📊</span> Dashboard</a>
      <a class="menu-item" href="entregas.html"><span class="icon">📦</span> Entregas</a>
      <a class="menu-item" href="motoristas.html"><span class="icon">👤</span> Motoristas</a>
      <a class="menu-item" href="veiculos.html"><span class="icon">🚛</span> Veículos</a>
      <a class="menu-item active" href="conjuntos.html"><span class="icon">🔗</span> Conjuntos</a>
      <a class="menu-item" href="ocorrencias.html"><span class="icon">⚠️</span> Ocorrências</a>
      <a class="menu-item" href="relatorios.html"><span class="icon">📈</span> Relatórios</a>
      <a class="menu-item" href="manutencoes.html"><span class="icon">🔧</span> Manutenções</a>
    </nav>
    <div class="sidebar-user">
      <button class="btn-tema" id="btn-tema" onclick="alternarTema()">🌙 Tema Escuro</button>
      <p>Logado como</p>
      <strong id="usuario-perfil"></strong>
      <button class="btn-logout" onclick="logout()">Sair</button>
    </div>
  </aside>

  <main class="main-content">
    <div class="page-header" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;">
      <div>
        <h1>Conjuntos</h1>
        <p>Gerencie os conjuntos de veículos e motoristas</p>
      </div>
      <button class="btn btn-primary" onclick="abrirModal()">+ Novo Conjunto</button>
    </div>

    <div id="cards-conjuntos" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-bottom:24px;">
      <div style="text-align:center;color:var(--text-light);padding:40px;">Carregando...</div>
    </div>
  </main>

  <!-- MODAL NOVO/EDITAR -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-titulo">Novo Conjunto</h2>
        <button class="btn-fechar" onclick="fecharModal()">✕</button>
      </div>
      <div class="form-grid">
        <div class="form-group" style="grid-column:span 2;">
          <label>Nome do conjunto *</label>
          <input type="text" id="nome" placeholder="Ex: Scania Verde + Sider Randon" />
        </div>
        <div class="form-group">
          <label>Motorista</label>
          <select id="motorista-id">
            <option value="">Sem motorista</option>
          </select>
        </div>
        <div class="form-group">
          <label>Cavalo mecânico</label>
          <select id="cavalo-id">
            <option value="">Sem cavalo</option>
          </select>
        </div>
        <div class="form-group">
          <label>Semirreboque 1</label>
          <select id="semirreboque1-id">
            <option value="">Sem semirreboque</option>
          </select>
        </div>
        <div class="form-group">
          <label>Semirreboque 2</label>
          <select id="semirreboque2-id">
            <option value="">Sem semirreboque</option>
          </select>
        </div>
      </div>
      <div style="margin-top:24px;display:flex;gap:12px;justify-content:flex-end;">
        <button class="btn btn-outline" onclick="fecharModal()">Cancelar</button>
        <button class="btn btn-primary" onclick="salvarConjunto()">Salvar</button>
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/conjuntos.js"></script>
</body>
</html>
