<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LogTrack — Login</title>
  <meta name="description" content="LogTrack — Sistema inteligente de gestão operacional para transportadoras: entregas, motoristas, veículos, manutenções e ocorrências em um só lugar." />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 56 66'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%232E75B6'/%3E%3Cstop offset='100%25' stop-color='%231E4D78'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M28 2C14.7 2 4 12.5 4 25.5 4 42 28 62 28 62S52 42 52 25.5C52 12.5 41.3 2 28 2Z' fill='url(%23g)'/%3E%3Cg fill='%23FFFFFF'%3E%3Crect x='10' y='18' width='6' height='9'/%3E%3Crect x='17' y='15' width='23' height='12' rx='1'/%3E%3Ccircle cx='14' cy='29' r='2.3'/%3E%3Ccircle cx='31' cy='29' r='2.3'/%3E%3Ccircle cx='38' cy='29' r='2.3'/%3E%3C/g%3E%3Ccircle cx='45' cy='9' r='7' fill='%2327AE60' opacity='0.25'/%3E%3Ccircle cx='45' cy='9' r='4' fill='%2327AE60'/%3E%3C/svg%3E" />
</head>
<body class="login-page">

  <div class="login-container">
    <div class="login-box">

      <div class="login-logo">
        <span class="logo-icon">
        <svg viewBox="0 0 56 66" width="56" height="66" role="img" aria-label="LogTrack">
        <defs>
          <linearGradient id="lt-grad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#2E75B6"/>
            <stop offset="100%" stop-color="#1E4D78"/>
          </linearGradient>
        </defs>
        <path d="M28 2C14.7 2 4 12.5 4 25.5 4 42 28 62 28 62S52 42 52 25.5C52 12.5 41.3 2 28 2Z" fill="url(#lt-grad)"/>
        <g fill="#FFFFFF">
          <rect x="10" y="18" width="6" height="9"/>
          <rect x="17" y="15" width="23" height="12" rx="1"/>
          <circle cx="14" cy="29" r="2.3"/>
          <circle cx="31" cy="29" r="2.3"/>
          <circle cx="38" cy="29" r="2.3"/>
        </g>
        <circle cx="45" cy="9" r="7" fill="#27AE60" opacity="0.25"/>
        <circle cx="45" cy="9" r="4" fill="#27AE60"/>
      </svg>
      </span>
        <h1>LogTrack</h1>
        <p>Sistema de Gestão Operacional</p>
      </div>

      <div id="erro-msg" class="erro-msg" style="display:none;"></div>

      <form id="form-login">
        <div class="input-group">
          <label>E-mail</label>
          <input type="email" id="email" placeholder="seu@email.com" required />
        </div>
        <div class="input-group">
          <label>Senha</label>
          <input type="password" id="senha" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn-login" id="btn-login">
          Entrar
        </button>
      </form>

    </div>
    <div class="login-footer">
      <a href="sobre.html" style="color:rgba(255,255,255,0.85);text-decoration:underline;">Sobre o sistema</a>
      <br />
      © 2025 LogTrack — Todos os direitos reservados
    </div>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
